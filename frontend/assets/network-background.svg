  <style>
    .edge { stroke: #454545; stroke-width: 1.15; opacity: .48; }
    .node { fill: #111; opacity: .76; transform-box: fill-box; transform-origin: center; animation: node-pulse 5s ease-in-out infinite alternate; }
    .node-soft { fill: #555; opacity: .58; }
    .delay-1 { animation-delay: -1.7s; }
    .delay-2 { animation-delay: -3.2s; }
    @keyframes node-pulse {
      from { opacity: .45; transform: scale(.85); }
      to { opacity: .95; transform: scale(1.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      .node { animation: none; }
    }
  </style>
